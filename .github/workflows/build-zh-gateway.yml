name: Build Chinese gateway
on:
  push:
    branches: [science-zh-activities]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: backend-source/desktop/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo test --locked dsh_chinese_instruction_tests
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: chinese-gateway-arm64
          path: backend-source/desktop/gateway/target/aarch64-apple-darwin/release/csswitch-gateway
