name: Windows compatibility
on:
  workflow_dispatch:
  push:
    branches: [windows-compat]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run plugin tests on Windows
        run: npm test
        env:
          DSH_WINDOWS_CI_DIAGNOSTICS: '1'
